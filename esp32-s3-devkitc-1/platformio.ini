; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; 工程路径含中文时, ESP32 链接器无法写 firmware.map, 用此脚本去掉 -Wl,-Map 选项
; 必须用 post: , 因为该选项由 framework 构建脚本添加, pre: 时机太早
extra_scripts = post:disable_map.py
lib_extra_dirs = ~/Documents/Arduino/libraries
; 串口监视器波特率, 必须和 main.cpp 里 Serial.begin(115200) 一致
monitor_speed = 115200
; 程序若启动时崩溃, 自动把地址解码成源码行号
monitor_filters = esp32_exception_decoder, time
; 游戏主程序: 编译 src 下所有文件, 但排除独立测试程序
build_src_filter = +<*> -<keypad_test.cpp>
lib_deps =
    olikraus/U8g2@^2.36.18
    adafruit/Adafruit GFX Library @ ^1.11.0
    adafruit/Adafruit ILI9341 @ ^1.6.0

; ===== 键盘自检环境 (临时, 测完可删) =====
; 编译上传: platformio.exe run -e keypad_test --target upload --upload-port COM6
[env:keypad_test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = post:disable_map.py
monitor_speed = 115200
build_src_filter = -<*> +<keypad_test.cpp>
